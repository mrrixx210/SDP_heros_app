# SDP Heroes ... local-dev Redis for BullMQ background jobs.
# Runs on the M4. Spin up with `docker compose up -d redis`.
services:
  redis:
    image: redis:7-alpine
    container_name: sdp-heroes-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
