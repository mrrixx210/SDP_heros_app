# Cloudflare tunnel config for SDP Heroes API.
# tunnel: filled in via env CLOUDFLARE_TUNNEL_ID_API
# Hostname routes to apps/api on port 3000.

tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: /Users/tonyrusso/.cloudflared/REPLACE_WITH_TUNNEL_ID.json

ingress:
  - hostname: api.superduperpros.com
    service: http://localhost:3000
  - service: http_status:404
